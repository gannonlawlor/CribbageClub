services:
  postgres:
    image: postgres:16-alpine
    container_name: cribbage-postgres
    environment:
      POSTGRES_DB: cribbagedb
      POSTGRES_USER: cribbage
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cribbage -d cribbagedb"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: cribbage-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/cribbagedb
      DATABASE_USERNAME: cribbage
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET environment variable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"

volumes:
  pgdata:
