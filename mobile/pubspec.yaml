name: cribbage_club
description: "Cribbage Club - Multiplayer Cribbage card game"
publish_to: 'none'

version: 1.0.14

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Native launch screen (also provides the runtime preserve/remove API)
  flutter_native_splash: ^2.4.3

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # WebSocket (STOMP)
  stomp_dart_client: ^2.0.0
  web_socket_channel: ^3.0.2

  # Models (annotations only)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Audio
  audioplayers: ^6.1.0

  # Sharing
  share_plus: ^10.0.0

  # Push notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Local storage
  shared_preferences: ^2.3.5
  rust_lib_cribbage_club:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  connectivity_plus: ^7.0.0

dependency_overrides:
  path_provider_foundation: 2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # App icon generation
  flutter_launcher_icons: ^0.14.3

  # Native launch screen generation
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

# Native launch screen (design language surfaces: dark = --surface-0,
# light = --surface-1 "warm paper"). The peg mark carries its own dark hole
# so it reads on either. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # The launch screen is drawn before Flutter boots, so it can only read the
  # OS appearance — not the app's saved theme. Since the app is dark-primary
  # and opens dark by default, the splash is dark in both cases so it never
  # flashes white ahead of a dark app.
  color: "#262421"
  color_dark: "#262421"
  image: assets/branding/splash_mark.png
  android_12:
    color: "#262421"
    color_dark: "#262421"
    image: assets/branding/splash_mark.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
