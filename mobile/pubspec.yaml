name: cribbage_club
description: "Cribbage Club - Multiplayer Cribbage card game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # WebSocket (STOMP)
  stomp_dart_client: ^2.0.0
  web_socket_channel: ^3.0.2

  # Models (annotations only)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local storage
  shared_preferences: ^2.3.5
  rust_lib_cribbage_club:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
