spring.application.name=CribbageClubServer
server.port=8080

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/cribbagedb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=cribbage
spring.datasource.password=cribbage
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# JWT Authentication
jwt.secret=dev-secret-key-change-in-production-must-be-256-bits-long!!
jwt.expiration-ms=86400000

# Game/lobby cleanup
game.timeout.inactive-minutes=30
lobby.timeout.inactive-minutes=15
cleanup.schedule.cron=0 */5 * * * *

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
