spring.application.name=CribbageClub
server.port=8080

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# PostgreSQL Database (env vars override for non-dev environments)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cribbagedb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:cribbage}
spring.datasource.password=${DATABASE_PASSWORD:cribbage}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# JWT Authentication (env var override for production)
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-must-be-256-bits-long!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Rate limiting (requests per window per IP)
rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX:10}
rate-limit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}

# Game/lobby cleanup
game.timeout.inactive-minutes=30
lobby.timeout.inactive-minutes=15
cleanup.schedule.cron=0 */5 * * * *

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
