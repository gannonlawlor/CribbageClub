spring.application.name=CribbageClubServer
server.port=8080

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# H2 Database (in-memory for now)
spring.datasource.url=jdbc:h2:mem:cribbagedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console (dev only, overridden in prod profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Authentication
jwt.secret=dev-secret-key-change-in-production-must-be-256-bits-long!!
jwt.expiration-ms=86400000

# Game/lobby cleanup
game.timeout.inactive-minutes=30
lobby.timeout.inactive-minutes=15
cleanup.schedule.cron=0 */5 * * * *

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
