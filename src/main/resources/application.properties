spring.application.name=CribbageClub
server.port=8080

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# PostgreSQL Database (env vars override for non-dev environments)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cribbagedb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:cribbage}
spring.datasource.password=${DATABASE_PASSWORD:cribbage}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway — baseline existing databases so V1 is skipped on first run
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Authentication (env var override for production)
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-must-be-256-bits-long!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7776000000}

# Rate limiting (requests per window per IP)
rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX:10}
rate-limit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}

# Turn timers — preset used when a client doesn't request one.
# Presets: BLITZ (10s/60s), RAPID (30s/120s), CASUAL (60s/300s), UNLIMITED (untimed).
# Override a preset's limits with e.g.
#   cribbage.timer.overrides.BLITZ.turn-time-limit-ms=15000
#   cribbage.timer.overrides.BLITZ.time-bank-ms=45000
cribbage.timer.default-time-control=${TIMER_DEFAULT_TIME_CONTROL:RAPID}

# Bot fallback matchmaking — a human-looking bot joins a quick-match lobby after
# wait-seconds with no human match. Delay ranges configurable via
#   cribbage.bots.delays.<discard|cut|pegging|count|default>.{min-ms,max-ms}
cribbage.bots.enabled=${BOTS_ENABLED:true}
cribbage.bots.wait-seconds=${BOTS_WAIT_SECONDS:60}
cribbage.bots.match-sweep-interval-ms=${BOTS_MATCH_SWEEP_INTERVAL_MS:10000}
cribbage.bots.move-sweep-interval-ms=${BOTS_MOVE_SWEEP_INTERVAL_MS:5000}

# Game/lobby cleanup
game.timeout.inactive-minutes=30
lobby.timeout.inactive-minutes=15
cleanup.schedule.cron=0 */5 * * * *

# CORS (comma-separated origin patterns)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# FCM Push Notifications (optional — disabled if not configured)
fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
fcm.project-id=${FCM_PROJECT_ID:}

# Actuator
management.endpoints.web.exposure.include=health,info
