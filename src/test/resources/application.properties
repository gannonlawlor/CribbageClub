# Test profile — H2 in-memory so tests stay fast and self-contained
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Ephemeral signing key for this test context only; never used by the app.
jwt.secret=${random.uuid}${random.uuid}

# CORS
cors.allowed-origin-patterns=http://localhost:*

# Disable rate limiting for tests
rate-limit.auth.max-requests=10000
rate-limit.auth.window-seconds=1
