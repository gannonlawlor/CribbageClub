services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: cribbage-tailscale
    hostname: ${TS_HOSTNAME}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: true
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.alpha.json:/config/serve.json:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cribbage-postgres
    environment:
      POSTGRES_DB: cribbagedb
      POSTGRES_USER: cribbage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cribbage -d cribbagedb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: cribbage-app
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: alpha
      DATABASE_URL: jdbc:postgresql://postgres:5432/cribbagedb
      DATABASE_USERNAME: cribbage
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random bytes}
      CORS_ALLOWED_ORIGINS: "https://${TS_FQDN}"
    restart: unless-stopped

volumes:
  tailscale-state:
  pgdata:
