services:
  postgres:
    image: postgres:16-alpine
    container_name: cribbage-postgres
    environment:
      POSTGRES_DB: cribbagedb
      POSTGRES_USER: cribbage
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cribbage -d cribbagedb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: cribbage-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: alpha
      DATABASE_URL: jdbc:postgresql://postgres:5432/cribbagedb
      DATABASE_USERNAME: cribbage
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: "https://${TAILSCALE_HOSTNAME}"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: cribbage-caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.alpha:/etc/caddy/Caddyfile
      - caddy_data:/data
      - ${TAILSCALE_CERT_DIR}:/etc/tailscale-certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
