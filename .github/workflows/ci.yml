name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (Build + Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cribbagedb
          POSTGRES_USER: cribbage
          POSTGRES_PASSWORD: cribbage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cribbage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build and test
        run: ./gradlew build

  lint:
    name: Backend (Detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      # Run the detekt CLI directly via the JDK. The previous
      # natiginfo/action-detekt-all Docker action broke permanently when Docker
      # Hub removed its `openjdk:jre-slim` base image, which aborted the whole
      # job at initialization. Same detekt version + config, no Docker.
      - name: Detekt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/detekt-cli.jar" \
            https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6-all.jar
          java -jar "$RUNNER_TEMP/detekt-cli.jar" --build-upon-default-config --input src

  mobile:
    name: Mobile (Analyze + Test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  image:
    name: Build + Push Image (GHCR)
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gannonlawlor/cribbage:sha-${{ steps.sha.outputs.short }}
            ghcr.io/gannonlawlor/cribbage:master
          cache-from: type=gha
          cache-to: type=gha,mode=max
